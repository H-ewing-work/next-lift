<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="description" content="Offline workout tracker: rolling queue, rest timer, weights and effort log.">
<title>Fitness</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-screen phone app — scrolling content, sticky rest-timer bar, fixed tab bar. Dark-first (gym floor), amber accent. */
:root{
  --bg:#15171b; --surface:#1e2127; --surface2:#272b33; --line:#353a45;
  --fg:#eef0f3; --muted:#9aa1ad; --accent:#f2a93b; --accent-fg:#1a1200;
  --good:#5cc57a; --later:#7aa7e8; --bad:#e5645a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f1ec; --surface:#ffffff; --surface2:#ebe8e1; --line:#d9d5cc;
    --fg:#1b1d22; --muted:#666c78; --accent:#c9741a; --accent-fg:#ffffff;
    --good:#2f9a52; --later:#3b6fc4; --bad:#c9453b; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f1ec; --surface:#ffffff; --surface2:#ebe8e1; --line:#d9d5cc;
  --fg:#1b1d22; --muted:#666c78; --accent:#c9741a; --accent-fg:#ffffff;
  --good:#2f9a52; --later:#3b6fc4; --bad:#c9453b; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1}
h2{font-size:1.35rem;line-height:1.1}
h3{font-size:1.1rem;line-height:1.15}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

#app{min-height:100%;padding:0 16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(150px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.offline-note{font-size:.8rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.between{justify-content:space-between}
.grow{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.hero{border-color:var(--accent);background:linear-gradient(160deg,var(--surface),var(--surface2))}
.card.soft{background:var(--surface2);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.good{background:var(--good);color:#04160a;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}

.chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.done{background:var(--good);color:#04160a;border-color:transparent}
.chip.later{background:var(--later);color:#07162e;border-color:transparent}
.chip.active{background:var(--accent);color:var(--accent-fg);border-color:transparent}

.list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex.done{opacity:.62}
.ex.later{border-color:var(--later)}
.ex.open{border-color:var(--accent)}
.ex-head{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left}
.ex-head .idx{width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.85rem;flex:none}
.ex.done .ex-head .idx{background:var(--good);color:#04160a}
.ex.later .ex-head .idx{background:var(--later);color:#07162e}
.ex-body{padding:0 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.ex-body>:first-child{margin-top:12px}
.sets{display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:8px;align-items:center}
.sets .hd{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sets input{width:100%;min-width:0;min-height:44px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
.sets .tick{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;font-size:1.1rem}
.sets .tick.on{background:var(--good);color:#04160a;border-color:transparent}
.sets .setno{font-size:.9rem;color:var(--muted);text-align:center}
.sets .setno.on{color:var(--fg)}

.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-family:var(--display);font-weight:700;font-size:1.05rem}
.scale button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.scale-legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

.big{font-family:var(--display);font-size:3.2rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.days button.on{background:var(--later);color:#07162e;border-color:transparent}

.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:8px;z-index:9}
.timerbar .inner{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px}
.timerbar .t{font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:82px;line-height:1}
.timerbar .t.over{color:var(--good)}
.timerbar .presets{display:flex;gap:4px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.timerbar .presets button{min-height:34px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);font-size:.85rem;font-weight:600}
.timerbar .presets button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.timerbar .ctl{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:1.1rem;font-weight:700;flex:none}
.timerbar .ctl.secondary{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;z-index:10}
.tabs .inner{max-width:560px;margin:0 auto;width:100%;display:flex}
.tabs button{flex:1;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.tabs button .ico{font-family:var(--display);font-size:1.15rem;font-weight:700;letter-spacing:0;text-transform:none}
.tabs button.on{color:var(--accent);background:var(--surface2)}

.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .sets-line{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:36px}
.spark i{flex:1;background:var(--later);border-radius:2px 2px 0 0;min-height:3px}
.spark i:last-child{background:var(--accent)}
/* activity log: day dots for a week, and sessions-per-week bars */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600}
.week .dot{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.week .gym .dot{background:var(--accent);border-color:transparent}
.week .run .dot{background:var(--later);border-color:transparent}
.week .both .dot{background:linear-gradient(135deg,var(--accent) 50%,var(--later) 50%);border-color:transparent}
.week .today .lbl{color:var(--fg)}
.week .today .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.wbars{display:flex;align-items:stretch;gap:6px;height:88px}
.wbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wbars .wb b{font-family:var(--display);font-size:.95rem;color:var(--fg);line-height:1;min-height:1em}
.wbars .wb .bw{flex:1;width:100%;display:flex;align-items:flex-end}
.wbars .wb i{display:block;width:100%;background:var(--later);border-radius:3px 3px 0 0;min-height:3px}
.wbars .wb:last-child i{background:var(--accent)}
.card.tap{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.divider{height:1px;background:var(--line)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ex,.btn,.chip{transition:background .15s,border-color .15s,opacity .15s}}

/* library: list rows, chips, segmented control */
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:32px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.lib-row{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lib-row .th{width:54px;height:54px;flex:none;border-radius:10px;background:var(--bg);overflow:hidden;display:grid;place-items:center}
.lib-row .th svg{width:100%;height:100%;display:block}
.lib-row .th .mm{width:26px;height:52px}
.lib-row .idx{width:24px;text-align:center;color:var(--muted);flex:none}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.k{color:var(--fg)}
.tag.p{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tag.s{border-color:var(--accent);color:var(--fg)}
.info{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:700;font-size:1rem;flex:none;border:1px solid var(--line);background:var(--surface2)}
.ex-top{display:flex;align-items:center;padding-right:10px}
.ex-top .ex-head{flex:1;min-width:0}
.linkish{color:var(--accent);font-weight:600;font-size:inherit}
a.btn{text-decoration:none;color:inherit}
.cue{color:var(--accent);font-weight:600}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* stick figures and muscle map */
svg.fg{display:block;background:var(--bg);border-radius:10px;width:100%}
.fig{stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
.hi{stroke:var(--accent);stroke-width:5}
.floor{stroke:var(--line);stroke-width:2;fill:none}
.wall{stroke:var(--line);stroke-width:2;stroke-dasharray:3 4}
.head{fill:var(--fg);stroke:none}
.m{fill:var(--line)}
.r{fill:var(--accent);opacity:.9}
.r2{fill:var(--accent);opacity:.4}
.maps{display:flex;gap:20px;justify-content:center}
.maps figure{margin:0;text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.maps svg{display:block;width:100%;background:var(--bg);border-radius:8px;margin-bottom:4px}
.week .stretch .dot{background:var(--good);border-color:transparent}
/* guided stretch routine */
.guide-fig{width:50%;max-width:200px;margin:0 auto}
.guide-fig .mm{width:70px;margin:0 auto}
.guide .big{font-size:4.6rem}
.guide .bar{height:8px}
/* full-screen sheet for cards and routines (sits above the app, never touches its state) */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:15;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:560px;margin:0 auto}
.sheet-top{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;display:flex;align-items:center;gap:12px;z-index:1}
</style>

<main id="app" aria-live="polite"></main>
<div id="timerbar" class="timerbar" hidden></div>
<nav class="tabs" aria-label="Sections"><div class="inner" id="tabs"></div></nav>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden></div>

<script>
(function(){
'use strict';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_S=['S','M','T','W','T','F','S'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const todayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate=iso=>{const d=new Date(iso);return DAYS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
const fmtTime=iso=>{const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fmtW=w=>(w==null||w===''||isNaN(w))?'—':(Number(w)%1?Number(w).toFixed(1):String(Number(w)))+'kg';
// Runs: time is stored as decimal minutes (28.5 = 28:30); pace is derived, never stored.
const fmtRunTime=mins=>{const t=Math.round(Number(mins)*60);if(!isFinite(t)||t<=0)return '—';const hh=Math.floor(t/3600),mm=Math.floor(t%3600/60),ss=t%60;return (hh?hh+':'+String(mm).padStart(2,'0'):String(mm))+':'+String(ss).padStart(2,'0')};
const fmtPace=(km,mins)=>{km=Number(km);mins=Number(mins);if(!(km>0)||!(mins>0))return '—';return mmss(mins*60/km).replace(/^0/,'')+' /km'};
const fmtKm=km=>{km=Number(km);return (km%1?km.toFixed(2).replace(/0$/,''):String(km))+' km'};
const runLine=s=>fmtKm(s.run.km)+' · '+fmtRunTime(s.run.mins)+' · '+fmtPace(s.run.km,s.run.mins);
const VERSION='v7';
// A chosen date (YYYY-MM-DD) as a timestamp: now if it's today, else midday on that day. Null if invalid or in the future.
function dateAt(key){if(!/^\d{4}-\d{2}-\d{2}$/.test(key||'')||key>todayKey())return null;if(key===todayKey())return new Date().toISOString();const d=parseKey(key);d.setHours(12,0,0,0);return d.toISOString()}
// Only show a workout duration when it's believable; an open session finished days later would otherwise show thousands of minutes.
const sessionMins=s=>{if(!s.startedAt||!s.completedAt)return null;const m=Math.round((new Date(s.completedAt)-new Date(s.startedAt))/60000);return m>0&&m<360?m:null};
// Activity log: weeks run Monday to Sunday; a week is keyed by its Monday as YYYY-MM-DD.
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const weekStart=(d=new Date())=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const weekKey=d=>todayKey(weekStart(d));
const dayIdx=d=>(new Date(d).getDay()+6)%7; // 0 = Monday
function weekSummary(list){const runs=list.filter(s=>s.kind==='run'),st=list.filter(s=>s.kind==='stretch');return {n:list.length,gym:list.length-runs.length-st.length,runs:runs.length,stretch:st.length,km:runs.reduce((a,s)=>a+Number((s.run&&s.run.km)||0),0)}}
const weekLine=w=>w.n?`${w.n} session${w.n===1?'':'s'}${w.gym?' · '+w.gym+' gym':''}${w.runs?' · '+w.runs+' run'+(w.runs===1?'':'s')+(w.km?' · '+fmtKm(w.km):''):''}${w.stretch?' · '+w.stretch+' stretch':''}`:'No sessions';
function weekLabel(k){const cur=weekStart();if(k===todayKey(cur))return 'This week';const prev=new Date(cur);prev.setDate(prev.getDate()-7);if(k===todayKey(prev))return 'Last week';const d=parseKey(k);return 'Week of '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function weekDots(list,isCurrent){const days=Array.from({length:7},()=>({gym:0,run:0,stretch:0}));list.forEach(s=>{days[dayIdx(s.completedAt)][s.kind==='run'?'run':s.kind==='stretch'?'stretch':'gym']++});const today=isCurrent?dayIdx(new Date()):-1;
  return `<div class="week" aria-hidden="true">${days.map((x,i)=>`<div class="d ${x.gym&&x.run?'both':x.gym?'gym':x.run?'run':x.stretch?'stretch':''}${i===today?' today':''}"><span class="dot"></span><span class="lbl">${DAYS_S[(i+1)%7]}</span></div>`).join('')}</div>`}

// ---------- state ----------
const S={plan:null,state:null,sessions:[],loaded:{plan:false,state:false,sessions:false},view:'today',openEx:null,finishOpen:false,runOpen:false,histOpen:null,edit:null,online:navigator.onLine};
const T={preset:90,remaining:90,endAt:null,running:false,fired:false};
S.lib={seg:'ex',q:'',kinds:[],areas:[]};S.sheet=[];S.tonightPick=false;

// ---------- persistence (on-device, works offline) ----------
// New installs start with an empty plan; build one in the Plan tab (or restore a backup).
const DEFAULT_PLAN={"runDays":[],"workouts":[]};
// ---------- exercise library (static content, not user data) ----------
// One entry per movement. ids are stable slugs — never rename once shipped (plan exercises point at them via libId).
// kind: lift | core | stretch. area: legs hips back chest shoulders arms core ankles.
// m / m2: primary / secondary muscle-map region ids (see MAP_REGIONS). fig: stick figure, stretches only.
const LIBRARY=[
// ----- lifts -----
{id:'back-squat',name:'Back squat',kind:'lift',area:['legs','hips'],equipment:'Barbell + rack',

const LS={plan:'nl_plan',state:'nl_state',sessions:'nl_sessions'};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e);toast('Could not save — storage is full or blocked')}};
const savePlan=()=>lsSet(LS.plan,S.plan);
const saveState=()=>lsSet(LS.state,S.state);
const saveSessions=()=>lsSet(LS.sessions,S.sessions);
function saveSession(s){upsertLocal(s);saveSessions()}
function persistDelete(){saveSessions()}
function upsertLocal(s){const i=S.sessions.findIndex(x=>x.id===s.id);if(i<0)S.sessions.push(s);else S.sessions[i]=s}
function initStore(){
  S.plan=lsGet(LS.plan,null);
  if(!S.plan){S.plan=clone(DEFAULT_PLAN);savePlan()}
  S.state=lsGet(LS.state,{cursor:0,activeSessionId:null});

}
function exportBackup(){
  const data={app:'next-lift',exportedAt:new Date().toISOString(),plan:S.plan,state:S.state,sessions:S.sessions};
  const json=JSON.stringify(data,null,1);const name='fitness-backup-'+todayKey()+'.json';
  const blob=new Blob([json],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Fitness backup'}).catch(()=>downloadBlob(blob,name));return}
  downloadBlob(blob,name);
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved to your downloads')}
function importBackup(file){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='next-lift'||!d.plan)throw 0;
    const existing=S.sessions.map(s=>s.id);const added=(d.sessions||[]).filter(s=>!existing.includes(s.id));
    S.sessions=S.sessions.concat(added);S.plan=d.plan;if(d.state)S.state=d.state;linkPlan();
    savePlan();saveState();saveSessions();S.edit=null;render();toast('Restored: '+added.length+' new session'+(added.length===1?'':'s')+' added')}
    catch{toast('That file is not a Fitness backup')}};
  r.readAsText(file);
}
// ---------- derived ----------
const ready=()=>S.loaded.plan&&S.loaded.state&&S.loaded.sessions;
const workouts=()=>(S.plan&&S.plan.workouts)||[];
const runDays=()=>(S.plan&&S.plan.runDays)||[];
function nextWorkout(){const w=workouts();if(!w.length)return null;return w[((S.state.cursor||0)%w.length+w.length)%w.length]}
function activeSession(){return S.sessions.find(s=>s.id===S.state.activeSessionId&&s.status==='active')||null}
const doneSessions=()=>S.sessions.filter(s=>s.status==='done').sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
function lastSets(exName,excludeId){
  for(const s of doneSessions()){if(s.id===excludeId||s.kind==='run')continue;
    for(const id of Object.keys(s.ex||{})){const e=s.ex[id];if(e.name===exName){const sets=(e.sets||[]).filter(x=>x.done&&(x.w!==''||x.r!==''));if(sets.length)return {sets,rpe:e.rpe,date:s.completedAt}}}}
  return null;
}
const setsLine=sets=>sets.map(x=>(x.w===''||x.w==null?'bw':(Number(x.w)%1?Number(x.w).toFixed(1):x.w))+'×'+(x.r??'')).join('  ');
function lastDoneOf(wid){return doneSessions().find(s=>s.workoutId===wid)||null}
function doneToday(){const k=todayKey();return doneSessions().filter(s=>s.kind==='gym'&&(s.completedAt||'').slice(0,10)===k)}

// ---------- actions ----------
function newSession(w){
  const ex={};const order=[];
  w.exercises.forEach(e=>{order.push(e.id);const last=lastSets(e.name);ex[e.id]={name:e.name,status:'todo',rpe:null,sets:Array.from({length:e.sets},(_,i)=>({w:last&&last.sets[i]?last.sets[i].w:(last&&last.sets.length?last.sets[last.sets.length-1].w:(e.weight||'')),r:e.reps,done:false}))}});
  return {id:uid(),kind:'gym',workoutId:w.id,name:w.name,tag:w.tag||'',startedAt:new Date().toISOString(),completedAt:null,status:'active',order,ex,feel:null,notes:''};
}
function startWorkout(){const w=nextWorkout();if(!w)return;let s=activeSession();if(!s){s=newSession(w);upsertLocal(s);saveSession(s);S.state.activeSessionId=s.id;saveState()}S.view='workout';S.openEx=firstTodo(s);S.finishOpen=false;render()}
function firstTodo(s){return s.order.find(id=>s.ex[id].status==='todo')||s.order.find(id=>s.ex[id].status==='later')||null}
function finishSession(s){
  s.status='done';s.completedAt=new Date().toISOString();
  Object.values(s.ex).forEach(e=>{if(e.status!=='done'&&e.sets.some(x=>x.done))e.status='done'});
  saveSession(s);
  if(S.state.activeSessionId===s.id)S.state.activeSessionId=null;
  const w=nextWorkout();if(w&&w.id===s.workoutId)S.state.cursor=((S.state.cursor||0)+1)%Math.max(1,workouts().length);
  saveState();S.view='today';S.finishOpen=false;S.openEx=null;stopTimer();render();toast(s.name+' logged. Nice work.');
}
function quickComplete(){const w=nextWorkout();if(!w)return;const s=newSession(w);s.ex&&Object.values(s.ex).forEach(e=>e.sets.forEach(x=>{x.done=false}));upsertLocal(s);S.state.activeSessionId=s.id;saveState();saveSession(s);S.view='workout';S.finishOpen=true;S.openEx=null;render();toast('Log any weights you remember, then complete')}
function skipWorkout(){const n=workouts().length;if(!n)return;S.state.cursor=((S.state.cursor||0)+1)%n;saveState();render();toast('Skipped — moved to the next session')}
function abandon(s){S.sessions=S.sessions.filter(x=>x.id!==s.id);persistDelete();S.state.activeSessionId=null;saveState();S.view='today';stopTimer();render();toast('Session discarded')}
function exById(id){for(const w of workouts())for(const e of w.exercises)if(e.id===id)return e;return null}

// ---------- timer ----------
let audio=null,tickInt=null;
function beep(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t+i*.25);g.gain.exponentialRampToValueAtTime(.4,t+i*.25+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.25+.2);o.connect(g).connect(audio.destination);o.start(t+i*.25);o.stop(t+i*.25+.22)}}catch{}
  try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch{}}
function primeAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch{}}
function startTimer(sec){primeAudio();if(sec!=null){T.preset=sec;T.remaining=sec}T.endAt=Date.now()+T.remaining*1000;T.running=true;T.fired=false;if(!tickInt)tickInt=setInterval(tick,250);renderTimer()}
function pauseTimer(){if(!T.running)return;T.remaining=Math.max(0,(T.endAt-Date.now())/1000);T.running=false;renderTimer()}
function resetTimer(){T.running=false;T.remaining=T.preset;T.fired=false;renderTimer()}
function stopTimer(){T.running=false;T.remaining=T.preset;T.fired=false;if(tickInt){clearInterval(tickInt);tickInt=null}renderTimer()}
function tick(){if(!T.running)return;const rem=(T.endAt-Date.now())/1000;if(rem<=0&&!T.fired){T.fired=true;beep()}renderTimer()}
function renderTimer(){
  const bar=$('#timerbar');const show=S.view==='workout'||T.running;bar.hidden=!show;if(!show)return;
  const rem=T.running?(T.endAt-Date.now())/1000:T.remaining;const over=rem<=0;
  const txt=over?'+'+mmss(-rem):mmss(rem);
  const presets=[60,90,120,180];
  bar.innerHTML=`<div class="inner">
    <div class="t ${over?'over':''}" aria-label="Rest timer">${txt}</div>
    <button class="ctl" data-act="t-toggle" aria-label="${T.running?'Pause':'Start'} timer">${T.running?'❚❚':'▶'}</button>
    <button class="ctl secondary" data-act="t-reset" aria-label="Reset timer">↺</button>
    <div class="presets">${presets.map(p=>`<button data-act="t-preset" data-v="${p}" class="${T.preset===p?'on':''}">${p<120?p+'s':(p/60)+'m'}</button>`).join('')}<button data-act="t-plus" aria-label="Add 30 seconds">+30</button></div>
  </div>`;
}

function viewHistory(){
  const ds=doneSessions();
  let out=`<div class="stack"><div class="row between"><h1>History</h1><button class="btn sm ${S.pastOpen?'':'primary'}" data-act="past-open">${S.pastOpen?'Close':'+ Log past session'}</button></div>`;
  if(S.pastOpen)out+=pastForm();
  if(!ds.length){out+=`<div class="card empty">Nothing logged yet. Your completed sessions and weight progress will show here.</div></div>`;return out}
  // activity: sessions per week for the last 8 weeks, newest on the right
  const byWeek={};ds.forEach(s=>{const k=weekKey(new Date(s.completedAt));(byWeek[k]=byWeek[k]||[]).push(s)});
  const weeks=[];{const m=weekStart();for(let i=7;i>=0;i--){const d=new Date(m);d.setDate(d.getDate()-7*i);weeks.push(todayKey(d))}}
  const counts=weeks.map(k=>(byWeek[k]||[]).length);const wmx=Math.max(...counts,1);const avg=counts.reduce((a,b)=>a+b,0)/weeks.length;
  out+=`<div class="card stack"><div class="row between"><div><div class="eyebrow">Last 8 weeks</div><b>${weekLine(weekSummary(byWeek[weeks[weeks.length-1]]||[]))} this week</b></div><span class="muted" style="font-size:.85rem;white-space:nowrap">avg ${avg%1?avg.toFixed(1):avg} / week</span></div>
    <div class="wbars" aria-label="Sessions per week">${weeks.map((k,i)=>{const n=counts[i];const d=parseKey(k);return `<div class="wb"><b>${n||''}</b><div class="bw"><i style="height:${Math.round(100*n/wmx)}%"></i></div><span>${d.getDate()}/${d.getMonth()+1}</span></div>`}).join('')}</div></div>`;
  // sessions grouped by week, newest first; tap a session for the detail
  out+=`<div><div class="eyebrow" style="margin-bottom:8px">Sessions</div><div class="stack" style="gap:18px">`;
  Object.keys(byWeek).sort().reverse().forEach(k=>{
    const list=byWeek[k];
    out+=`<div class="stack" style="gap:8px"><div class="row between"><b>${weekLabel(k)}</b><span class="muted" style="font-size:.85rem">${weekLine(weekSummary(list))}</span></div>${weekDots(list,k===weeks[weeks.length-1])}<div class="list">`;
    list.forEach(s=>out+=sessionItem(s));
    out+=`</div></div>`;
  });
  out+=`</div></div>`;
  // progress per exercise
  const prog={};
  ds.slice().reverse().forEach(s=>{if(s.kind!=='gym')return;Object.values(s.ex||{}).forEach(e=>{const ws=(e.sets||[]).filter(x=>x.done&&x.w!==''&&x.w!=null).map(x=>Number(x.w));if(!ws.length)return;(prog[e.name]=prog[e.name]||[]).push(Math.max(...ws))})});
  const names=Object.keys(prog);
  if(names.length){
    out+=`<div><div class="eyebrow" style="margin-bottom:8px">Top set by session</div><div class="list">${names.map(n=>{const v=prog[n].slice(-8);const mx=Math.max(...v,1);const first=v[0],lastv=v[v.length-1];const diff=lastv-first;return `<div class="card soft row between"><div class="grow"><b>${h(n)}</b><div class="muted" style="font-size:.85rem">${v.length} session${v.length>1?'s':''} · now <span class="num">${fmtW(lastv)}</span>${v.length>1?` · <span style="color:${diff>0?'var(--good)':diff<0?'var(--bad)':'var(--muted)'}">${diff>0?'+':''}${diff%1?diff.toFixed(1):diff}kg</span>`:''}</div></div><div class="spark" style="width:96px" aria-hidden="true">${v.map(x=>`<i style="height:${Math.max(8,Math.round(100*x/mx))}%"></i>`).join('')}</div></div>`}).join('')}</div></div>`;
  }
  // runs: count, distance, and a pace trend (lower bar = faster)
  const runs=ds.filter(s=>s.kind==='run'&&s.run&&Number(s.run.km)>0&&Number(s.run.mins)>0);
  if(runs.length){
    const totalKm=runs.reduce((a,s)=>a+Number(s.run.km),0);
    const paces=runs.slice(0,8).reverse().map(s=>Number(s.run.mins)/Number(s.run.km));const mx=Math.max(...paces);
    const best=runs.reduce((a,s)=>{const p=Number(s.run.mins)/Number(s.run.km);return p<a.p?{p,s}:a},{p:Infinity,s:null}).s;
    out+=`<div><div class="eyebrow" style="margin-bottom:8px">Runs</div><div class="card soft row between"><div class="grow"><b>${runs.length} run${runs.length>1?'s':''} · ${fmtKm(totalKm)}</b><div class="muted" style="font-size:.85rem">Last <span class="num">${fmtPace(runs[0].run.km,runs[0].run.mins)}</span>${best&&runs.length>1?` · best <span class="num" style="color:var(--good)">${fmtPace(best.run.km,best.run.mins)}</span> over ${fmtKm(best.run.km)}`:''}</div></div><div class="spark" style="width:96px" aria-hidden="true" title="Pace, last ${paces.length} runs">${paces.map(p=>`<i style="height:${Math.max(8,Math.round(100*p/mx))}%"></i>`).join('')}</div></div></div>`;
  }
  out+=`</div>`;return out;
}

// ---------- library: lookups, drawings, cards, routines ----------
const AREAS=[['legs','Legs'],['hips','Hips'],['back','Back'],['chest','Chest'],['shoulders','Shoulders'],['arms','Arms'],['core','Core'],['ankles','Ankles & feet']];
const KINDS=[['lift','Lifts'],['core','Core'],['stretch','Stretches']];
const areaLabel=a=>(AREAS.find(x=>x[0]===a)||[a,a])[1];
const kindLabel=k=>({lift:'Lift',core:'Core',stretch:'Stretch'})[k]||k;
// A plan exercise → its library entry: by libId first, then an exact (case-insensitive) name match, else nothing.
const libFor=e=>e?((e.libId&&LIB_BY_ID[e.libId])||LIB_BY_NAME[(e.name||'').toLowerCase()]||null):null;
// Fill libId on stored plan exercises that predate the library (ids from the original plan). Runs on load and after a restore.
function linkPlan(){let changed=false;((S.plan&&S.plan.workouts)||[]).forEach(w=>(w.exercises||[]).forEach(e=>{if(!e.libId&&LIB_MAP[e.id]){e.libId=LIB_MAP[e.id];changed=true}}));if(changed)savePlan()}
const routineById=id=>STRETCH_ROUTINES.find(r=>r.id===id)||null;
const itemDose=i=>(i.seconds?i.seconds+'s':i.reps+' reps')+(i.sets>1?' × '+i.sets:'')+(i.perSide?' each side':'');
function figSVG(e){return e.fig?`<svg class="fg" viewBox="0 0 140 140" aria-hidden="true">${e.fig}</svg>`:''}
function mapViews(e){return ['f','b'].map(v=>{const regs=Object.entries(MAP_REGIONS).filter(([,r])=>r.v.includes(v));const sec=regs.filter(([id])=>e.m2.includes(id)).map(([,r])=>`<path class="r2" d="${r.d}"/>`).join('');const pri=regs.filter(([id])=>e.m.includes(id)).map(([,r])=>`<path class="r" d="${r.d}"/>`).join('');return `<svg viewBox="0 0 70 140" aria-hidden="true">${MAP_BASE}${sec}${pri}</svg>`})}
function mapSVG(e,size){const [f,b]=mapViews(e);return `<div class="maps"><figure><div style="width:${size}px">${f}</div>Front</figure><figure><div style="width:${size}px">${b}</div>Back</figure></div>`}
const thumbSVG=e=>e.fig?figSVG(e):`<div class="mm">${mapViews(e)[0]}</div>`;
const infoBtn=lib=>lib?`<button class="info" data-act="lib-open" data-v="${lib.id}" aria-label="How to do ${h(lib.name)}">i</button>`:'';
function appearsIn(lib){return {w:workouts().filter(w=>(w.exercises||[]).some(e=>libFor(e)===lib)),r:STRETCH_ROUTINES.filter(r=>r.items.some(i=>i.libId===lib.id))}}
// Tonight's stretch: the routine for a gym session done today; else the run routine on run days (or after a logged run);
// else the routine for the most recent workout. A "change" pick on Today overrides it for that day only.
function tonightRoutine(){
  const k=todayKey();const t=S.state&&S.state.tonight;if(t&&t.date===k&&routineById(t.id))return routineById(t.id);
  const ds=doneSessions();const byWorkout=id=>STRETCH_ROUTINES.find(r=>r.workoutId===id);
  const gymToday=ds.find(s=>s.kind==='gym'&&(s.completedAt||'').slice(0,10)===k);if(gymToday&&byWorkout(gymToday.workoutId))return byWorkout(gymToday.workoutId);
  const runToday=ds.find(s=>s.kind==='run'&&(s.completedAt||'').slice(0,10)===k);if(runToday||runDays().includes(new Date().getDay()))return routineById('sr-run');
  const lastGym=ds.find(s=>s.kind==='gym');if(lastGym&&byWorkout(lastGym.workoutId))return byWorkout(lastGym.workoutId);
  return STRETCH_ROUTINES[0];
}
function tonightHTML(){const r=tonightRoutine();
  return `<div class="card soft stack" style="gap:8px"><div class="row between"><div class="grow"><div class="eyebrow">Tonight’s stretch</div><h3>${h(r.name)}</h3><div class="muted" style="font-size:.85rem">${r.minutes} min · ${h(r.focus)} · <button class="linkish" data-act="tonight-change">${S.tonightPick?'close':'change'}</button></div></div><button class="btn sm" data-act="routine-open" data-v="${r.id}">Open</button></div>
    ${S.tonightPick?`<div class="chips">${STRETCH_ROUTINES.map(x=>`<button data-act="tonight-set" data-v="${x.id}" class="${x.id===r.id?'on':''}">${h(x.name)}</button>`).join('')}</div>`:''}</div>`}

// ----- Library tab -----
function libFiltered(){const q=S.lib.q.trim().toLowerCase();return LIBRARY.filter(e=>(!S.lib.kinds.length||S.lib.kinds.includes(e.kind))&&(!S.lib.areas.length||e.area.some(a=>S.lib.areas.includes(a)))&&(!q||e.name.toLowerCase().includes(q)||e.primary.concat(e.secondary).some(t=>t.toLowerCase().includes(q)))).sort((a,b)=>a.name.localeCompare(b.name))}
function libListHTML(){const L=libFiltered();if(!L.length)return `<div class="empty">Nothing matches that.</div>`;
  return L.map(e=>`<button class="lib-row" data-act="lib-open" data-v="${e.id}"><div class="th">${thumbSVG(e)}</div><div class="grow"><div style="font-weight:600">${h(e.name)}</div><div class="tags" style="margin-top:3px"><span class="tag k">${kindLabel(e.kind)}</span>${e.primary.slice(0,2).map(t=>`<span class="tag">${h(t)}</span>`).join('')}</div></div><span class="muted">›</span></button>`).join('')}
function viewLibrary(){
  let out=`<div class="stack"><h1>Library</h1><div class="seg"><button data-act="lib-seg" data-v="ex" class="${S.lib.seg==='ex'?'on':''}">Exercises</button><button data-act="lib-seg" data-v="st" class="${S.lib.seg==='st'?'on':''}">Stretches</button></div>`;
  if(S.lib.seg==='ex'){
    out+=`<div class="field"><input id="lib-q" type="search" placeholder="Search by name or muscle" value="${h(S.lib.q)}" autocomplete="off"></div>
      <div class="chips"><button data-act="lib-kind" data-v="" class="${S.lib.kinds.length?'':'on'}">All</button>${KINDS.map(([k,l])=>`<button data-act="lib-kind" data-v="${k}" class="${S.lib.kinds.includes(k)?'on':''}">${l}</button>`).join('')}</div>
      <div class="chips">${AREAS.map(([a,l])=>`<button data-act="lib-area" data-v="${a}" class="${S.lib.areas.includes(a)?'on':''}">${l}</button>`).join('')}</div>
      <div class="list" id="lib-list">${libListHTML()}</div>`;
  }else{
    out+=`<div class="muted" style="font-size:.9rem">Five 15-minute bedtime routines: one after each gym session, one for run days. Tap a routine for the list, then any movement for how to do it.</div>
      <div class="list">${STRETCH_ROUTINES.map(r=>`<button class="lib-row" data-act="routine-open" data-v="${r.id}"><div class="grow"><div style="font-weight:600">${h(r.name)}</div><div class="muted" style="font-size:.85rem"><span class="num">${r.minutes} min</span> · ${r.items.length} movements · ${h(r.focus)}</div></div><span class="muted">›</span></button>`).join('')}</div>`;
  }
  return out+`</div>`;
}

// ----- overlay sheet: a card or a routine, stacked so a card opened from a routine returns to it -----
function openSheet(x){S.sheet.push(x);renderSheet()}
function closeSheet(){S.sheet.pop();renderSheet()}
function renderSheet(){const el=$('#sheet');const top=S.sheet[S.sheet.length-1];
  if(!top){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return}
  if(top.t==='guide'){if(!S.guide){S.sheet.pop();renderSheet();return}el.hidden=false;document.body.style.overflow='hidden';el.innerHTML=`<div class="inner">${guideHTML()}</div>`;el.scrollTop=0;guideClock();return}
  const e=top.t==='card'?LIB_BY_ID[top.id]:null,r=top.t==='routine'?routineById(top.id):null;
  if(!e&&!r){S.sheet.pop();renderSheet();return}
  el.hidden=false;document.body.style.overflow='hidden';el.innerHTML=`<div class="inner">${e?cardHTML(e):routineHTML(r)}</div>`;el.scrollTop=0}
function cardHTML(e){const ap=appearsIn(e);
  return `<div class="sheet-top"><button class="btn sm" data-act="sheet-back">‹ Back</button><div class="grow" style="min-width:0"><div class="eyebrow">${kindLabel(e.kind)} · ${e.area.map(areaLabel).join(', ')}</div><h2>${h(e.name)}</h2></div></div>
  <div class="stack">
    ${e.fig?`<div style="width:60%;max-width:240px;margin:0 auto">${figSVG(e)}</div>`:mapSVG(e,110)}
    <p style="margin:0;font-size:1.05rem">${h(e.summary)}</p>
    <div><div class="eyebrow" style="margin-bottom:6px">How to</div><ol class="steps">${e.steps.map(s=>`<li>${h(s)}</li>`).join('')}</ol></div>
    <div class="card soft stack" style="gap:8px"><div><div class="eyebrow">Cue</div><div class="cue">${h(e.cue)}</div></div><div><div class="eyebrow">Common mistake</div><div>${h(e.mistake)}</div></div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Targets</div><div class="tags">${e.primary.map(t=>`<span class="tag p">${h(t)}</span>`).join('')}${e.secondary.map(t=>`<span class="tag s">${h(t)}</span>`).join('')}</div>${e.fig?`<div style="margin-top:12px">${mapSVG(e,72)}</div>`:''}</div>
    ${e.ski?`<div class="card soft"><div class="eyebrow">For skiing</div><div>${h(e.ski)}</div></div>`:''}
    <div class="muted" style="font-size:.9rem">Equipment: ${h(e.equipment)}</div>
    ${(ap.w.length||ap.r.length)?`<div><div class="eyebrow" style="margin-bottom:6px">Appears in</div><div class="chips">${ap.w.map(w=>`<span class="tag">${h(w.name)}</span>`).join('')}${ap.r.map(r=>`<button data-act="routine-open" data-v="${r.id}">${h(r.name)}</button>`).join('')}</div></div>`:''}
    <a class="btn block" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.demo)}" target="_blank" rel="noopener">▶ Watch a demo <span class="muted" style="font-weight:400">(needs signal)</span></a>
  </div>`}
function routineHTML(r){
  return `<div class="sheet-top"><button class="btn sm" data-act="sheet-back">‹ Back</button><div class="grow" style="min-width:0"><div class="eyebrow">Bedtime stretch · ${r.minutes} min · ${r.items.length} movements</div><h2>${h(r.name)}</h2></div></div>
  <div class="stack">
    <div class="muted">Focus: ${h(r.focus)}. Seconds are per side where it says each side.</div>
    <button class="btn primary block" data-act="guide-start" data-v="${r.id}">▶ Start routine</button>
    <div class="muted" style="font-size:.85rem;text-align:center">Counts each movement down with a 5s change-over and a ding at each start and finish. Keep the screen on.</div>
    <div class="card soft" style="font-size:.9rem">${ROUTINE_SHORTCUT}</div>
    <div class="list">${r.items.map((i,n)=>{const e=LIB_BY_ID[i.libId];return `<button class="lib-row" data-act="lib-open" data-v="${e.id}"><span class="idx num">${n+1}</span><div class="th">${thumbSVG(e)}</div><div class="grow"><div style="font-weight:600">${h(e.name)}</div><div class="muted" style="font-size:.85rem"><span class="num" style="color:var(--fg)">${itemDose(i)}</span>${i.note?' · '+h(i.note):''}</div></div></button>`}).join('')}</div>
  </div>`}

// ----- guided stretch routine: every side and set is its own step, with a 5s change-over between steps -----
const GAP=5;
function routineSteps(r){const steps=[];r.items.forEach(it=>{const e=LIB_BY_ID[it.libId];const sets=it.sets||1;const sides=it.perSide?['Side 1','Side 2']:[null];for(let s=0;s<sets;s++)for(const side of sides)steps.push({e,seconds:it.seconds||null,reps:it.reps||null,side,set:sets>1?s+1:null,sets,note:it.note||''})});return steps}
// Soft single ding when a movement starts, lower double ding when it finishes. Gentler than the rest timer's alarm.
function ding(kind){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime;const notes=kind==='end'?[[660,0],[660,.28]]:[[880,0]];notes.forEach(([f,at])=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+at);g.gain.exponentialRampToValueAtTime(.22,t+at+.02);g.gain.exponentialRampToValueAtTime(.0001,t+at+.6);o.connect(g).connect(audio.destination);o.start(t+at);o.stop(t+at+.65)})}catch{}
  try{navigator.vibrate&&navigator.vibrate(kind==='end'?[50,80,50]:50)}catch{}}
let gInt=null;
function guideStart(r){primeAudio();S.guide={rid:r.id,steps:routineSteps(r),i:0,phase:'gap',remaining:GAP,endAt:Date.now()+GAP*1000,running:true,startedAt:new Date().toISOString()};if(!gInt)gInt=setInterval(guideTick,250);S.sheet.push({t:'guide'});renderSheet();wakeLock(true)}
function guideStop(){if(gInt){clearInterval(gInt);gInt=null}S.guide=null;wakeLock(S.view==='workout')}
function guideTick(){const g=S.guide;if(!g||!g.running)return;if((g.endAt-Date.now())<=0){guideAdvance();return}guideClock()}
function guideClock(){const g=S.guide;if(!g||g.phase==='done')return;const el=$('#g-time');if(!el)return;const st=g.steps[g.i];const rem=g.running?(g.endAt-Date.now())/1000:g.remaining;
  if(g.phase==='gap')el.textContent=String(Math.max(1,Math.ceil(rem)));else if(st.seconds)el.textContent=mmss(rem);
  const bar=$('#g-bar');if(bar){const total=g.phase==='gap'?GAP:(st.seconds||1);bar.style.width=Math.round(100*(1-Math.max(0,rem)/total))+'%'}}
function guideGo(i){const g=S.guide;g.i=i;g.phase='gap';g.remaining=GAP;g.endAt=Date.now()+GAP*1000;g.running=true;renderSheet()}
function guideAdvance(){const g=S.guide;if(!g)return;
  if(g.phase==='gap'){const st=g.steps[g.i];ding('start');g.phase='move';if(st.seconds){g.remaining=st.seconds;g.endAt=Date.now()+st.seconds*1000;g.running=true}else g.running=false;renderSheet();return}
  ding('end');if(g.i>=g.steps.length-1){guideFinish();return}guideGo(g.i+1)}
function guideFinish(){const g=S.guide;g.phase='done';g.running=false;const r=routineById(g.rid);
  const sess={id:uid(),kind:'stretch',workoutId:r.id,routineId:r.id,name:r.name,startedAt:g.startedAt,completedAt:new Date().toISOString(),status:'done',order:[],ex:{},feel:null,notes:''};upsertLocal(sess);saveSession(sess);renderSheet()}
function guideHTML(){const g=S.guide;const r=routineById(g.rid);
  if(g.phase==='done'){const mins=Math.max(1,Math.round((Date.now()-new Date(g.startedAt))/60000));return `<div class="sheet-top"><div class="grow"><div class="eyebrow">${h(r.name)}</div><h2>Routine complete</h2></div></div>
    <div class="stack guide"><div class="card hero stack" style="text-align:center"><div class="big" style="color:var(--good)">✓</div><div>${g.steps.length} movements · ${mins} min</div><div class="muted">Logged in History as a stretch session.</div></div><button class="btn primary block" data-act="guide-close">Done</button></div>`}
  const st=g.steps[g.i];const e=st.e;const gap=g.phase==='gap';const next=g.steps[g.i+1];
  const label=[st.side,st.set?`set ${st.set} of ${st.sets}`:null].filter(Boolean).join(' · ');
  return `<div class="sheet-top"><button class="btn sm" data-act="guide-end">End</button><div class="grow" style="min-width:0"><div class="eyebrow">${h(r.name)}</div><h2>${g.i+1} of ${g.steps.length}</h2></div></div>
  <div class="stack guide">
    <div class="card ${gap?'soft':'hero'} stack" style="text-align:center">
      <div class="eyebrow">${gap?'Get ready':'Now'}</div>
      <h1>${h(e.name)}</h1>
      <div class="muted">${label?label+' · ':''}${st.seconds?st.seconds+'s':st.reps+' reps'}${st.note?' · '+h(st.note):''}</div>
      <div class="guide-fig">${e.fig?figSVG(e):`<div class="mm">${mapViews(e)[0]}</div>`}</div>
      <div class="big" id="g-time">${gap?GAP:(st.seconds?mmss(st.seconds):st.reps+' reps')}</div>
      ${(gap||st.seconds)?`<div class="bar"><i id="g-bar" style="width:0%"></i></div>`:`<button class="btn good block" data-act="guide-done">Done — next</button>`}
    </div>
    <div class="grid3"><button class="btn" data-act="guide-prev" ${g.i===0&&gap?'disabled':''}>‹ Back</button><button class="btn" data-act="guide-pause" ${(gap||st.seconds)?'':'disabled'}>${g.running?'❚❚ Pause':'▶ Resume'}</button><button class="btn" data-act="guide-skip">Skip ›</button></div>
    <div class="muted" style="text-align:center">${next?'Then: '+h(next.e.name)+(next.side||next.set?' ('+[next.side,next.set?'set '+next.set:null].filter(Boolean).join(', ').toLowerCase()+')':''):'Last one.'}</div>
  </div>`}

// ---------- events ----------
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,v=b.dataset.v;const s=activeSession();
  const ex=(id)=>s&&s.ex[id];
  switch(act){
    case 'tab':if(v==='workout'&&!s)return;S.view=v;S.edit=null;render();break;
    case 'start':startWorkout();break;
    case 'complete-yes':if(s){S.view='workout';S.finishOpen=true;render()}else quickComplete();break;
    case 'not-yet':toast('No problem — it stays as your next workout.');break;
    case 'skip':skipWorkout();break;
    case 'run-toggle':S.runOpen=!S.runOpen;render();break;
    case 'run-feel':S.runFeel=Number(v);document.querySelectorAll('#run-scale button').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)===S.runFeel));break;
    case 'past-open':S.pastOpen=!S.pastOpen;if(!S.pastOpen){S.pastFeel=null;S.pastType=null;S.pastDate=null;S.pastNotes=''}render();break;
    case 'past-feel':S.pastFeel=Number(v);document.querySelectorAll('#past-scale button').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)===S.pastFeel));break;
    case 'past-save':{const when=dateAt($('#past-date').value);if(!when){toast('Pick a date that isn’t in the future');return}
      const type=$('#past-type').value,notes=($('#past-notes').value||'').trim();let s;
      if(type==='run'){const km=parseFloat($('#past-km').value),mins=(parseFloat($('#past-min').value)||0)+(parseFloat($('#past-sec').value)||0)/60;if(!(km>0)||!(mins>0)){toast('Add distance and time first');return}
        s={id:uid(),kind:'run',workoutId:'run',name:'Run',startedAt:when,completedAt:when,status:'done',order:[],ex:{},feel:S.pastFeel||null,notes,run:{km,mins:Math.round(mins*1000)/1000}}}
      else{const w=workouts().find(x=>x.id===type);if(!w){toast('Pick a workout');return}s=newSession(w);s.startedAt=when;s.completedAt=when;s.status='done';s.feel=S.pastFeel||null;s.notes=notes;
        Object.values(s.ex).forEach(e=>{e.status='done';e.sets.forEach(x=>{x.done=false})})}
      upsertLocal(s);saveSession(s);S.pastOpen=false;S.pastFeel=null;S.pastType=null;S.pastDate=null;S.pastNotes='';S.histOpen=s.id;render();toast(s.name+' logged for '+fmtDate(when));break}
    case 'run-save':{const km=parseFloat($('#run-km').value),m=parseFloat($('#run-min').value)||0,sec=parseFloat($('#run-sec').value)||0;const mins=m+sec/60;
      if(!(km>0)||!(mins>0)){toast('Add distance and time first');return}
      const when=dateAt($('#run-date').value);if(!when){toast('Pick a date that isn’t in the future');return}
      const r={id:uid(),kind:'run',workoutId:'run',name:'Run',startedAt:when,completedAt:when,status:'done',order:[],ex:{},feel:S.runFeel||null,notes:($('#run-notes').value||'').trim(),run:{km,mins:Math.round(mins*1000)/1000}};
      upsertLocal(r);saveSession(r);S.runOpen=false;S.runFeel=null;render();toast('Run logged · '+fmtPace(km,mins));break}
    case 'refresh':refreshApp();break;
    case 'open-ex':S.openEx=S.openEx===v?null:v;render();break;
    case 'set-done':{const e=ex(b.dataset.ex);if(!e)return;const i=Number(b.dataset.i);const st=e.sets[i];readInputs(s);st.done=!st.done;saveSession(s);if(st.done){const def=exById(b.dataset.ex);startTimer(def?def.rest:90)}render();break}
    case 'add-set':{const e=ex(v);readInputs(s);const l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:l?l.r:'',done:false});saveSession(s);render();break}
    case 'del-set':{const e=ex(v);if(e.sets.length>1){readInputs(s);e.sets.pop();saveSession(s);render()}break}
    case 'rpe':{const e=ex(b.dataset.ex);readInputs(s);e.rpe=e.rpe===Number(v)?null:Number(v);saveSession(s);render();break}
    case 'ex-later':{readInputs(s);ex(v).status='later';s.order=s.order.filter(x=>x!==v).concat([v]);saveSession(s);S.openEx=firstTodo(s);render();toast('Parked — it’s at the bottom of the list');break}
    case 'ex-done':{readInputs(s);const e=ex(v);e.status='done';e.sets.forEach(x=>{if(x.w!==''||x.r!=='')x.done=x.done||true});saveSession(s);S.openEx=firstTodo(s);if(!S.openEx)S.finishOpen=true;render();break}
    case 'ex-reopen':{readInputs(s);ex(v).status='todo';saveSession(s);render();break}
    case 'finish-open':readInputs(s);S.finishOpen=true;render();setTimeout(()=>{const f=document.querySelector('.card.hero');f&&f.scrollIntoView({behavior:'smooth',block:'start'})},30);break;
    case 'finish-close':readInputs(s);S.finishOpen=false;render();break;
    case 'feel':readInputs(s);s.feel=s.feel===Number(v)?null:Number(v);saveSession(s);render();break;
    case 'finish-confirm':readInputs(s);finishSession(s);break;
    case 'abandon':if(b.dataset.sure){abandon(s)}else{b.dataset.sure='1';b.textContent='Tap again to discard';}break;
    case 't-toggle':T.running?pauseTimer():startTimer();break;
    case 't-reset':resetTimer();break;
    case 't-preset':T.preset=Number(v);T.remaining=T.preset;T.fired=false;if(T.running)T.endAt=Date.now()+T.preset*1000;renderTimer();break;
    case 't-plus':T.remaining=(T.running?(T.endAt-Date.now())/1000:T.remaining)+30;if(T.running)T.endAt=Date.now()+T.remaining*1000;T.fired=false;renderTimer();break;
    case 'h-open':S.histOpen=S.histOpen===v?null:v;render();break;
    case 'h-delete':if(b.dataset.sure){S.sessions=S.sessions.filter(x=>x.id!==v);persistDelete();S.histOpen=null;render();toast('Deleted')}else{b.dataset.sure='1';b.textContent='Tap again to delete';}break;
    // library, cards, routines
    case 'lib-seg':S.lib.seg=v;render();break;
    case 'lib-kind':S.lib.kinds=v?(S.lib.kinds.includes(v)?S.lib.kinds.filter(x=>x!==v):S.lib.kinds.concat([v])):[];render();break;
    case 'lib-area':S.lib.areas=S.lib.areas.includes(v)?S.lib.areas.filter(x=>x!==v):S.lib.areas.concat([v]);render();break;
    case 'lib-open':openSheet({t:'card',id:v});break;
    case 'routine-open':openSheet({t:'routine',id:v});break;
    case 'sheet-back':closeSheet();break;
    case 'guide-start':guideStart(routineById(v));break;
    case 'guide-pause':{const g=S.guide;if(!g)return;if(g.running){g.running=false;g.remaining=Math.max(0,(g.endAt-Date.now())/1000)}else{g.endAt=Date.now()+g.remaining*1000;g.running=true}renderSheet();break}
    case 'guide-skip':{const g=S.guide;if(!g)return;if(g.i>=g.steps.length-1)guideFinish();else guideGo(g.i+1);break}
    case 'guide-prev':{const g=S.guide;if(!g)return;guideGo(g.phase==='gap'?Math.max(0,g.i-1):g.i);break}
    case 'guide-done':guideAdvance();break;
    case 'guide-end':if(b.dataset.sure){guideStop();closeSheet()}else{b.dataset.sure='1';b.textContent='Tap again to end';}break;
    case 'guide-close':guideStop();S.sheet=[];renderSheet();render();break;
    case 'tonight-change':S.tonightPick=!S.tonightPick;render();break;
    case 'tonight-set':S.state.tonight={id:v,date:todayKey()};saveState();S.tonightPick=false;render();break;
    // plan
    case 'p-runday':{S.plan=S.plan||{workouts:[],runDays:[]};const d=Number(v);S.plan.runDays=runDays().includes(d)?runDays().filter(x=>x!==d):runDays().concat([d]).sort();savePlan();render();break}
    case 'backup':exportBackup();break;
    case 'p-reset-plan':if(b.dataset.sure){S.plan=clone(DEFAULT_PLAN);S.state.cursor=0;savePlan();saveState();S.edit=null;render();toast('Plan cleared. Your history is untouched.')}else{b.dataset.sure='1';b.textContent='Tap again to clear every workout (history is kept)';}break;
    case 'p-add-workout':S.edit={type:'workout',wid:null};render();break;
    case 'p-edit-workout':S.edit={type:'workout',wid:v};render();break;
    case 'p-cancel':S.edit=null;render();break;
    case 'p-save-workout':{const name=$('#f-wname').value.trim();if(!name){toast('Give it a name');return}S.plan=S.plan||{workouts:[],runDays:[]};S.plan.workouts=S.plan.workouts||[];
      if(v){const w=S.plan.workouts.find(x=>x.id===v);w.name=name;w.tag=$('#f-wtag').value.trim()}else S.plan.workouts.push({id:'w-'+uid().slice(0,8),name,tag:$('#f-wtag').value.trim(),exercises:[]});
      S.state=S.state||{cursor:0,activeSessionId:null};savePlan();S.edit=null;render();break}
    case 'p-del-workout':if(b.dataset.sure){S.plan.workouts=S.plan.workouts.filter(x=>x.id!==v);S.state.cursor=0;savePlan();saveState();S.edit=null;render()}else{b.dataset.sure='1';b.textContent='Tap again to delete';}break;
    case 'p-move-w':{const ws=S.plan.workouts;const i=ws.findIndex(x=>x.id===v);const j=i+Number(b.dataset.d);if(j<0||j>=ws.length)return;[ws[i],ws[j]]=[ws[j],ws[i]];savePlan();render();break}
    case 'p-set-next':{const i=S.plan.workouts.findIndex(x=>x.id===v);S.state.cursor=i;saveState();render();toast(S.plan.workouts[i].name+' is now next');break}
    case 'p-add-ex':S.edit={type:'exercise',wid:v,eid:null};render();break;
    case 'p-edit-ex':S.edit={type:'exercise',wid:b.dataset.w,eid:v};render();break;
    case 'p-save-ex':{const w=S.plan.workouts.find(x=>x.id===b.dataset.w);const name=$('#f-ename').value.trim();if(!name){toast('Name the exercise');return}
      const data={name,sets:Math.max(1,parseInt($('#f-esets').value)||3),reps:parseInt($('#f-ereps').value)||8,weight:$('#f-eweight').value===''?'':parseFloat($('#f-eweight').value),rest:parseInt($('#f-erest').value)||90,perSide:$('#f-eside').checked,note:$('#f-enote').value.trim()};
      if(v){Object.assign(w.exercises.find(x=>x.id===v),data)}else w.exercises.push(Object.assign({id:'e-'+uid().slice(0,8)},data));
      savePlan();S.edit=null;render();break}
    case 'p-del-ex':if(b.dataset.sure){const w=S.plan.workouts.find(x=>x.id===b.dataset.w);w.exercises=w.exercises.filter(x=>x.id!==v);savePlan();S.edit=null;render()}else{b.dataset.sure='1';b.textContent='Tap again to remove';}break;
    case 'p-move-e':{const w=S.plan.workouts.find(x=>x.id===b.dataset.w);const i=w.exercises.findIndex(x=>x.id===v);const j=i+Number(b.dataset.d);if(j<0||j>=w.exercises.length)return;[w.exercises[i],w.exercises[j]]=[w.exercises[j],w.exercises[i]];savePlan();render();break}
  }
});
// typed values → in-memory session, debounced save (no re-render while typing)
function readInputs(s){if(!s)return;document.querySelectorAll('#app input[data-f]').forEach(inp=>{const e=s.ex[inp.dataset.ex];if(!e)return;const st=e.sets[Number(inp.dataset.i)];if(!st)return;st[inp.dataset.f]=inp.value===''?'':Number(inp.value)});const n=$('#notes');if(n)s.notes=n.value}
document.addEventListener('input',ev=>{const inp=ev.target;if(!inp.matches('#app input[data-f],#app textarea[data-f]'))return;const s=activeSession();if(!s)return;readInputs(s);saveSession(s)});
// live average pace while typing a run
document.addEventListener('input',ev=>{const m=/^(run|past)-(km|min|sec)$/.exec(ev.target.id);if(!m)return;const x=m[1];const p=$('#'+x+'-pace');if(!p)return;const km=parseFloat($('#'+x+'-km').value),mins=(parseFloat($('#'+x+'-min').value)||0)+(parseFloat($('#'+x+'-sec').value)||0)/60;p.textContent=fmtPace(km,mins)});
document.addEventListener('input',ev=>{if(ev.target.id!=='lib-q')return;S.lib.q=ev.target.value;const l=$('#lib-list');if(l)l.innerHTML=libListHTML()});
// switching the past-session form between a workout and a run re-renders it, keeping what's typed
document.addEventListener('change',ev=>{if(ev.target.id!=='past-type')return;S.pastType=ev.target.value;S.pastDate=$('#past-date').value;S.pastNotes=$('#past-notes').value;render()});
// re-render without losing anything typed into an open workout
function safeRender(){const s=activeSession();if(s)readInputs(s);render()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTimer();if(S.view==='workout')safeRender()}});

document.addEventListener('change',ev=>{if(ev.target.id==='import-file'&&ev.target.files[0]){importBackup(ev.target.files[0]);ev.target.value=''}});
window.addEventListener('online',()=>{S.online=true;if(S.view==='plan')safeRender()});
window.addEventListener('offline',()=>{S.online=false;if(S.view==='plan')safeRender()});

// keep the screen on during a workout where the browser allows it
let wake=null;
async function wakeLock(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch{wake=null}}
const _render=render;render=function(){_render();wakeLock(S.view==='workout')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.view==='workout')wakeLock(true)});

// offline support: cache the app on first load so it opens with no signal
const hasSW='serviceWorker' in navigator&&location.protocol.startsWith('http');
if(hasSW){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller&&!S.refreshing)toast('Update ready — reopen the app to get it')})});
  }).catch(e=>console.warn('sw',e));
}
// "Check for updates": fetch a new service worker if there is one, make the worker re-download the app
// files from the server (bypassing every cache), then reload so the fresh copy is what's running.
async function refreshApp(){
  if(S.refreshing)return;
  if(!navigator.onLine){toast('No signal — connect to the internet and try again');return}
  if(!hasSW||!navigator.serviceWorker.controller){location.reload();return}
  S.refreshing=true;render();
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){console.warn('update',e)}
  const refreshed=new Promise(res=>{
    const on=e=>{if(e.data&&e.data.type==='refreshed'){navigator.serviceWorker.removeEventListener('message',on);res(e.data.ok)}};
    navigator.serviceWorker.addEventListener('message',on);setTimeout(()=>res(null),10000);
  });
  const ctl=navigator.serviceWorker.controller;ctl&&ctl.postMessage({type:'refresh'});
  const ok=await refreshed;
  if(ok===false){S.refreshing=false;render();toast('Could not reach the server — try again later');return}
  location.reload();
}

initStore();
})();
</script>
